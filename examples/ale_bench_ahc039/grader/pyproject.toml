[project]
name = "ale-bench-grader"
version = "0.1.0"
description = "CORAL grader for ALE-Bench (AtCoder Heuristic Contest) problems."
requires-python = ">=3.11"
dependencies = [
    "coral",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ale_bench_grader"]
